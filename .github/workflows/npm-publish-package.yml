name: Publish npm Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Ref to validate. Manual runs never publish.
        required: false
        type: string
      dist_tag:
        description: Dist-tag for validation only. Defaults to latest.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.target.outputs.source_sha }}
      package_version: ${{ steps.target.outputs.package_version }}
      manifest_sha256: ${{ steps.target.outputs.manifest_sha256 }}
      dist_tag: ${{ steps.target.outputs.dist_tag }}
      publish: ${{ steps.target.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      - name: Resolve immutable inputs
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_REF: ${{ inputs.git_ref }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: node .github/release/release.mjs prepare

  validate:
    name: Validate release artifact
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      - name: Install verified npm CLI
        run: node .github/release/release.mjs bootstrap-npm
      - name: Test release controls
        run: node --test .github/release/release.test.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: |
          cp .github/release/package-lock.json package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Build and test package exports
        run: |
          npm run build --ignore-scripts
          npm run test:node --ignore-scripts
      - name: Pack and verify the release artifact
        id: pack
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          RELEASE_SHA: ${{ needs.prepare.outputs.source_sha }}
          MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: node .github/release/release.mjs pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact/sdk.tgz
          if-no-files-found: error

  publish:
    name: Publish verified artifact
    needs: [prepare, validate]
    if: >-
      github.repository == 'Gauntlet-xyz/sdk' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.prepare.outputs.source_sha }}
      BEFORE_SHA: ${{ github.event.before }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
      MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
      ARTIFACT_SHA256: ${{ needs.validate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifact
      - name: Verify release authority, environment, and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release/release.mjs verify-release
      - name: Install verified npm CLI
        run: node .github/release/release.mjs bootstrap-npm
      - name: Reject a version below npm latest
        run: node .github/release/release.mjs verify-registry
      - name: Publish the verified archive
        run: >-
          npm publish ./release-artifact/sdk.tgz
          --provenance --ignore-scripts
          --registry=https://registry.npmjs.org
          --access public --tag latest
